name: daily

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      examples:
        description: "Comma-separated example names (default: all)"
        required: false
        default: ""

concurrency:
  group: daily
  cancel-in-progress: false

permissions:
  contents: write
  actions: read   # needed for `gh api .../actions/runs/.../jobs` from the run step

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
      ts_version: ${{ steps.versions.outputs.ts }}
      py_version: ${{ steps.versions.outputs.py }}
      rs_version: ${{ steps.versions.outputs.rs }}
      go_version: ${{ steps.versions.outputs.go }}
      java_version: ${{ steps.versions.outputs.java }}
      run_date: ${{ steps.date.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - run: bun install
      - id: date
        run: echo "value=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - id: versions
        run: |
          TS=$(npm view @resonatehq/sdk version)
          PY=$(curl -sf https://pypi.org/pypi/resonate-sdk/json | jq -r '.info.version')
          RS=$(curl -sf -A "examples-ci (resonatehq)" https://crates.io/api/v1/crates/resonate-sdk | jq -r '.crate.max_stable_version')
          # Go SDK is on pseudo-versions only (v0.0.0-<date>-<hash>); pull from
          # the module proxy and use it verbatim with `go get`. When a real
          # tag ships, this still works — proxy reports the latest tag.
          GO=$(curl -sf https://proxy.golang.org/github.com/resonatehq/resonate-sdk-go/@latest | jq -r '.Version')
          # Java SDK: best-effort from Maven Central's repo metadata (the
          # search API stopped returning latestVersion and lags new releases).
          # Empty string is fine — java rows compile and run against the SDK
          # pinned in their committed build.gradle.kts; this value is report-only.
          JAVA=$(curl -sf "https://repo1.maven.org/maven2/io/resonatehq/resonate-sdk-java/maven-metadata.xml" \
            | sed -n 's:.*<latest>\(.*\)</latest>.*:\1:p' || echo "")
          [ -z "$TS" ] && { echo "ts version resolution failed"; exit 1; }
          [ -z "$PY" ] && { echo "py version resolution failed"; exit 1; }
          [ -z "$RS" ] && { echo "rs version resolution failed"; exit 1; }
          [ -z "$GO" ] && { echo "go version resolution failed"; exit 1; }
          echo "ts=$TS" >> "$GITHUB_OUTPUT"
          echo "py=$PY" >> "$GITHUB_OUTPUT"
          echo "rs=$RS" >> "$GITHUB_OUTPUT"
          echo "go=$GO" >> "$GITHUB_OUTPUT"
          echo "java=$JAVA" >> "$GITHUB_OUTPUT"
          echo "Resolved: ts=$TS py=$PY rs=$RS go=$GO java=${JAVA:-unknown}"
      - id: matrix
        env:
          TS_VERSION: ${{ steps.versions.outputs.ts }}
          PY_VERSION: ${{ steps.versions.outputs.py }}
          RS_VERSION: ${{ steps.versions.outputs.rs }}
          GO_VERSION: ${{ steps.versions.outputs.go }}
          JAVA_VERSION: ${{ steps.versions.outputs.java }}
        run: |
          MATRIX=$(bun run scripts/build-matrix.ts "${{ inputs.examples }}")
          echo "Matrix size: $(echo "$MATRIX" | jq 'length')"
          echo "value=$MATRIX" >> "$GITHUB_OUTPUT"

  coverage-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - run: bun install
      - name: Coverage check
        # Verifies every non-archived example-* repo in resonatehq-examples has
        # a manifest row (run, build_only, or skip). Fail = repo was added to the
        # org without a corresponding manifest entry, so CI was silently blind to it.
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun run scripts/coverage-check.ts

  readme-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - run: bun install
      - name: README snippet drift
        # For every manifest repo that carries a sottovoce.json, verifies the
        # README's code fences still match the source files they quote. The
        # matrix proves an example RUNS; this proves its README shows the code
        # that runs. Repos without a sottovoce.json are skipped.
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun run scripts/readme-drift.ts

  run:
    needs: resolve
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include: ${{ fromJson(needs.resolve.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          repository: resonatehq-examples/${{ matrix.repo }}
          path: example
      - uses: actions/checkout@v4
        with:
          path: ci
      - if: matrix.sdk == 'ts'
        uses: actions/setup-node@v4
        with: { node-version: "22" }
      - if: matrix.sdk == 'ts'
        uses: oven-sh/setup-bun@v1
      - if: matrix.sdk == 'py'
        uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - if: matrix.sdk == 'rs'
        uses: dtolnay/rust-toolchain@stable
      # rdkafka-sys (used by example-kafka-worker-rs via the `cmake-build`
      # feature) compiles librdkafka from source against SASL/SSL/zstd/lz4
      # headers. ubuntu-latest images don't include all of them; install
      # BEFORE the rust-cache restore so cmake's autodetect (whose results
      # get cached with the build artifacts) sees the deps available.
      - if: matrix.sdk == 'rs' && contains(matrix.services_json, 'redpanda')
        name: Install librdkafka build deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsasl2-dev libssl-dev libzstd-dev liblz4-dev libcurl4-openssl-dev pkg-config
      - if: matrix.sdk == 'rs'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: example
          # Redpanda-needing shards get their own cache namespace. Without
          # this, the first failed-cold-cmake build would poison the cache
          # for every subsequent rs run (cmake's "sasl not detected" gets
          # baked into the cached build artifacts).
          prefix-key: ${{ contains(matrix.services_json, 'redpanda') && 'v2-rdkafka' || 'v2' }}
      - if: matrix.sdk == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - if: matrix.sdk == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Run example
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
          EXAMPLE_DIR: ${{ github.workspace }}/example
          EXAMPLE_NAME: ${{ matrix.repo }}
          SDK_VERSION: ${{ matrix.sdk_version }}
          KIND: ${{ matrix.kind }}
          ENTRY: ${{ matrix.entry }}
          TIMEOUT_S: ${{ matrix.timeout_s }}
          HEALTHY_AFTER_S: ${{ matrix.healthy_after_s }}
          HEALTH_REGEX: ${{ matrix.health_regex }}
          REQUIRES_SERVER: ${{ matrix.requires_server }}
          SERVER_KIND: ${{ matrix.server_kind }}
          SERVICES_JSON: ${{ matrix.services_json }}
          MULTI_CONFIG: ${{ matrix.multi_config }}
          BUILD_ONLY: ${{ matrix.build_only }}
          SUBDIRS_JSON: ${{ matrix.subdirs_json }}
          BUILD_CMD: ${{ matrix.build_cmd }}
          # Lifts the anonymous 60/hr rate limit on the release-tag lookup
          # in runners/lib/server.sh — see comment there.
          GITHUB_TOKEN: ${{ github.token }}
        run: ci/runners/${{ matrix.sdk }}/run.sh
      # Capture the current job's URL into result.json so the dashboard
      # can deep-link directly to the failing shard. GH Actions doesn't
      # expose the current job's databaseId as an env var, so we look it
      # up by name pattern via the API.
      - name: Capture job URL into result.json
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          [ -f result.json ] || exit 0
          JOB_ID=$(gh api --paginate \
            repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs \
            --jq '[.jobs[] | select(.name | startswith("run (${{ matrix.repo }},"))][0].id' \
            2>/dev/null || echo "")
          if [ -n "$JOB_ID" ] && [ "$JOB_ID" != "null" ]; then
            JOB_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/job/$JOB_ID"
            jq --arg url "$JOB_URL" '. + { job_url: $url }' result.json > _r.tmp && mv _r.tmp result.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-${{ matrix.repo }}
          path: result.json
      # Multi-process / driver logs aren't part of result.json's stderr_tail;
      # upload them as a separate artifact so gateway crashes / driver
      # mismatches can be debugged after the fact.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: multi-logs-${{ matrix.repo }}
          path: |
            example/multi-*.out
            example/multi-*.err
            example/build.err
            example/install.err
            /tmp/resonate.log
            /tmp/redpanda.start.log
            /tmp/tb.log
            /tmp/tb.format.log
          if-no-files-found: ignore

  aggregate:
    needs: [resolve, run, coverage-check, readme-drift]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - run: bun install
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Aggregate
        env:
          RUN_DATE: ${{ needs.resolve.outputs.run_date }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TS_VERSION: ${{ needs.resolve.outputs.ts_version }}
          PY_VERSION: ${{ needs.resolve.outputs.py_version }}
          RS_VERSION: ${{ needs.resolve.outputs.rs_version }}
          GO_VERSION: ${{ needs.resolve.outputs.go_version }}
          JAVA_VERSION: ${{ needs.resolve.outputs.java_version }}
        run: bun run scripts/aggregate.ts
      - uses: actions/upload-artifact@v4
        with:
          name: summary
          path: |
            summary.json
            public/
      # Skip dashboard publish for subset runs (workflow_dispatch with
      # `examples=foo,bar`). Subset runs only re-run the named shards, so
      # publishing would overwrite the dashboard with an N-of-total view
      # and lose all the other examples' status. Operators triggering a
      # subset want to validate their entries, not refresh the dashboard;
      # the next no-arg run (or the 07:00 UTC cron) restores the full
      # picture.
      - name: Publish to gh-pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && inputs.examples == ''
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          keep_files: false
      - name: Notify Echo
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && inputs.examples == ''
        env:
          ECHO_API_URL: ${{ vars.ECHO_API_URL }}
          ECHO_API_KEY: ${{ secrets.ECHO_API_KEY }}
        run: |
          # No silent failures — Echo missing the daily report is a real
          # operational issue and the workflow should go red so on-call sees it.
          # The only "skip" is when Echo isn't configured at all (initial deploy);
          # any post-config failure surfaces.
          if [ -z "$ECHO_API_URL" ] || [ -z "$ECHO_API_KEY" ]; then
            echo "Echo notification skipped (ECHO_API_URL/ECHO_API_KEY unset — first deploy?)"
            exit 0
          fi
          curl -sSf \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 30 \
            --max-time 60 \
            -X POST "$ECHO_API_URL/api/examples-ci/report" \
            -H "X-Echo-Key: $ECHO_API_KEY" \
            -H "Content-Type: application/json" \
            -d @summary.json
          echo "Echo notification succeeded"
      # Visibility gate: fail the workflow when any examples are failing so
      # the daily run (and subset validation dispatches) go red in the GitHub
      # UI. Also fails if the coverage check detected an unregistered repo.
      # Runs after the publish + Echo steps so the dashboard still updates
      # on failure. Skipped on pull_request events (no summary.json available).
      - name: Fail if any examples are failing
        if: github.event_name != 'pull_request'
        env:
          COVERAGE_RESULT: ${{ needs.coverage-check.result }}
          DRIFT_RESULT: ${{ needs.readme-drift.result }}
        run: |
          set -euo pipefail
          FAILING=$(jq '.totals.failing' summary.json)
          TOTAL=$(jq '.totals.total' summary.json)
          GATE_FAILED=0
          if [ "$FAILING" -gt 0 ]; then
            echo "::error::${FAILING}/${TOTAL} examples are failing:"
            jq -r '.results[] | select(.status != "passing") | "  - \(.repo): \(.status)"' summary.json
            GATE_FAILED=1
          fi
          if [ "$COVERAGE_RESULT" = "failure" ]; then
            echo "::error::manifest coverage check failed — one or more repos in resonatehq-examples are missing from manifests/examples.yaml"
            GATE_FAILED=1
          fi
          if [ "$DRIFT_RESULT" = "failure" ]; then
            echo "::error::README snippet drift — one or more example READMEs show code that no longer matches the source file it quotes (see the readme-drift job)"
            GATE_FAILED=1
          fi
          if [ "$GATE_FAILED" = "1" ]; then exit 1; fi
          echo "All ${TOTAL} examples passing and manifest coverage is complete."
