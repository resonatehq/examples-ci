  - repo: example-openai-deep-research-agent-rs
    sdk: rs
    requires_server: true
    services: [mock_llm]
    kind: script
    entry: "cargo run --release -- ci-001 'distributed systems' 1"
    timeout_s: 240

  # ---- Phase 2 deferred (skip=true): AI examples needing rework ----

