        ready_regex: "ready — waiting for tasks"
        healthy_after_s: 30
    client:
      entry: "go run ./cmd/client -n 6"
      timeout_s: 60

  # ---- Phase 1.5 wave 9 (more Go: localnet-by-default examples) ----
  # These 6 examples default to the in-process `localnet` transport — no
  # external Resonate server needed. Bare `go run .` works for all six.
