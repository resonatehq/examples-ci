    client:
      entry: |
        /tmp/resonate invoke orchestration.ci.1 --func orchestrate --arg '"CI topic"' --arg false
        for i in $(seq 1 90); do
          if grep -qE '\[reviewer\] +\{' multi-worker.out 2>/dev/null; then
            exit 0
          fi
          sleep 1
        done
        echo "expected reviewer completion log within 90s" >&2
        tail -n 30 multi-worker.out >&2 || true
        exit 1
      timeout_s: 150

  # multi-agent-ts: embedded (new Resonate()), runs inline via resonate.run.
