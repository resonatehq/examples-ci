        done
        echo "expected scan completion log within 90s" >&2
        tail -n 30 multi-worker.out >&2 || true
        exit 1
      timeout_s: 150

  # multi-agent-py: orchestrate(topic, crash_on_writer=False) runs three
  # sequential agent calls (researcher → writer → reviewer). The worker
