  # load-balancing-go: single Go binary that starts N=3 worker goroutines
  # internally + a client goroutine that dispatches M=6 tasks and collects
  # results. From CI's view it's a single-process script — no multi-process
  # orchestration needed. Does require a real `resonate dev` server (-url
  # is required; localnet has no shared bus across worker instances).
  - repo: example-load-balancing-go
    sdk: go
    kind: script
    requires_server: true
    entry: "go run . -url=http://localhost:8001"
    timeout_s: 60

  # ---- Phase 1.5 wave 10 (external services: Redpanda + TigerBeetle) ----
  # First use of the `services:` field. Each named service has a helper at
  # runners/lib/services/<kind>.sh that starts/stops it; the runner starts
  # services after the Resonate server but before `setup:` runs, so setup
  # steps and processes can rely on the service being reachable.
  #
  # Redpanda is the Kafka-compatible broker the example-kafka-worker-*
  # examples connect to at localhost:9092 (no SASL). The helper runs the
  # official Redpanda image via `docker run` (ubuntu-latest CI has docker).
  #
  # TigerBeetle is the System of Record for the account-creation example.
  # The helper downloads the latest tigerbeetle release, formats a fresh
  # single-replica data file in /tmp, starts the server on port 3000, and
  # symlinks the binary into $EXAMPLE_DIR/bin/tigerbeetle so the example's
  # own scripts (which reference ./bin/tigerbeetle) work unmodified.

  # The workflow has random retries (25% transient error) and random
  # completion (25% per batch). 1 message + 240s timeout gives enough budget
  # for several batch attempts with 5s sleeps between. Pass = "all rows
  # deleted for record" appears in the consumer's log.
  - repo: example-kafka-worker-ts
    sdk: ts
    requires_server: true
    services: [redpanda]
    setup:
      - "bun run setup-topics"
    processes:
      - name: consumer
        entry: "bun run consume"
        ready_regex: "processor running"
        healthy_after_s: 20
    client:
      entry: |
        bun run produce -- -n 1
        for i in $(seq 1 300); do
          if grep -q "all rows deleted for record" multi-consumer.out 2>/dev/null; then
            exit 0
          fi
          sleep 1
        done
        echo "expected 'all rows deleted for record' in multi-consumer.out within 300s" >&2
        tail -n 30 multi-consumer.out >&2 || true
        exit 1
      timeout_s: 360

  # SKIPPED 2026-06-03: the Rust SDK has no automatic ctx.run step retry,
  # but this example depends on it. lib.rs delete_batch returns
  # Err(Error::Application) on a 25% "transient" roll and comments "Resonate
  # retries automatically" — true for the TS/Py SDKs (both siblings pass),
  # false for rs. resonate-sdk-rs 0.4.0 has no retry surface at all (no
  # retry/max_attempts/backoff in src); core.rs only RELEASES a task on
  # execution failure for crash-recovery, while a user Err settles the
  # promise as terminally rejected. Server log from run 26906295324 confirms:
  # promise 3f59...0 settled rejected, then 5 min of listener re-registration
  # with zero re-execution. Producer sends -n 1, so one early 25% error =
  # dead run (~50% per-record completion odds with no retry → ~daily red).
  # Re-enroll when EITHER the rs SDK gains automatic step retry, OR the
  # example is rewritten to retry in user code (and the "retries
  # automatically" comment is corrected). Tracked for the SDK team.
  - repo: example-kafka-worker-rs
    sdk: rs
    requires_server: true
    skip: true
    services: [redpanda]
    # The runner's cargo build --release compiles both binaries (consumer +
    # producer) up front, so the cargo-run calls below hit a warm cache.
    processes:
      - name: consumer
        entry: "cargo run --release --bin consumer"
        ready_regex: "processor running"
        healthy_after_s: 60
    client:
      entry: |
        cargo run --release --bin producer -- -n 1
        for i in $(seq 1 300); do
          if grep -q "all rows deleted for record" multi-consumer.out 2>/dev/null; then
            exit 0
          fi
          sleep 1
        done
        echo "expected 'all rows deleted for record' in multi-consumer.out within 300s" >&2
        tail -n 30 multi-consumer.out >&2 || true
        exit 1
      timeout_s: 360

  # kafka-worker-py: same shape as the ts/rs siblings against a single-
  # broker Redpanda. Worker uses Resonate.remote() and blocks in its own
  # consume() loop after resonate.start() so the runner doesn't need an
  # Event().wait() guard. CI installs via `pip install -e .` so the
  # [project.scripts] aliases (record-producer, record-deletor, setup-
  # topics) are direct PATH binaries — no `uv run` prefix.
  - repo: example-kafka-worker-py
    sdk: py
    requires_server: true
    services: [redpanda]
    setup:
      - "setup-topics"
    processes:
      - name: consumer
        entry: "record-deletor"
        ready_regex: "processor running"
        healthy_after_s: 30
    client:
      entry: |
        record-producer -n 1
        for i in $(seq 1 300); do
          if grep -q "all rows deleted for record" multi-consumer.out 2>/dev/null; then
            exit 0
          fi
          sleep 1
        done
        echo "expected 'all rows deleted for record' in multi-consumer.out within 300s" >&2
        tail -n 30 multi-consumer.out >&2 || true
        exit 1
      timeout_s: 360

  # The example expects bin/tigerbeetle (provided by services/tigerbeetle.sh
  # via symlink) and bin/accounts.db (we create it in setup). The script
  # exits 0 on success (printing UUID + GUID); subsequent runs against the
  # same DB return "exists_same" and still exit 0, so the test is idempotent.
  - repo: example-tigerbeetle-account-creation-ts
    sdk: ts
    requires_server: true
    services: [tigerbeetle]
    setup:
      - "mkdir -p bin"
      - "sqlite3 bin/accounts.db 'CREATE TABLE accounts (uuid TEXT PRIMARY KEY, guid TEXT NOT NULL UNIQUE);'"
    client:
      entry: "npm run demo"
      timeout_s: 60

  # ---- Phase 1.5 wave 11 (cloud-creds-gated: tracking skip rows) ----
  # All four examples require real cloud credentials + provisioned
  # resources (AWS Lambda, Databricks workspace, Supabase project).
  # Running them daily would burn live credits, leak secrets to fork
  # PRs, and gate the matrix on infra changes outside Resonate's
  # control. Their SDK surface duplicates what's already covered by
  # money-transfer-rs / function-as-a-service-py / etc., so a green
  # examples-ci doesn't lose meaningful signal by skipping them.
  # Revisit when someone files a real-world bug that would have been
  # caught here. Spec:
  # resonate/handoffs/2026-05-22-examples-ci-iter-gh-proposals.md §H.2.

  - repo: example-aws-lambda-ts
    sdk: ts
    skip: true

  - repo: example-lambda-workers-py
    sdk: py
    skip: true

  - repo: example-databricks-in-the-loop-py
    sdk: py
    skip: true

  - repo: example-supabase-edge-ts
    sdk: ts
    skip: true

  # ---- Phase 2 wave 12 (mocked-LLM pilot: 1 OpenAI + 1 Anthropic) ----
  # Iter G — first AI-agent examples enrolled. The `mock_llm` service
  # (Python http.server on :8080) serves canned chat.completions +
  # messages JSON; start_mock_llm exports OPENAI_BASE_URL,
  # ANTHROPIC_BASE_URL and dummy API keys so the SDKs route here.
  # Examples that use tools (schedule-reminder, deep-research-agent-*)
  # need a tool-aware mock — deferred to a follow-up wave.

  # HN agent registers scanKeyword + monitorHackerNews then waits.
  # `resonate invoke scan-ci-001` dispatches into the running worker,
  # which fetches HN stories (real Algolia API call, public + free),
  # analyzes each via the mock LLM, then logs "Found N interesting" or
  # "No interesting findings". Either is a pass.
  - repo: example-hackernews-research-agent-ts
    sdk: ts
    requires_server: true
    services: [mock_llm]
    processes:
      - name: worker
        entry: "npm run dev"
        ready_regex: "Hacker News Agent Worker Started"
        healthy_after_s: 20
    client:
      entry: |
        /tmp/resonate invoke scan-ci-001 --func scanKeyword --arg '"resonate"'
        for i in $(seq 1 90); do
          if grep -qE "Found .* interesting|No interesting findings" multi-worker.out 2>/dev/null; then
            exit 0
          fi
          sleep 1
        done
        echo "expected scan completion log within 90s" >&2
        tail -n 30 multi-worker.out >&2 || true
        exit 1
      timeout_s: 150

  # Chatbot uses `new Resonate()` (embedded — no server). --crash flag
  # selects the scripted non-interactive demo: 3 turns, turn 2's LLM
  # call throws on first attempt, Resonate retries automatically. The
  # mock satisfies the messages.create() call; the throw is internal
  # to the example so the mock is hit twice on turn 2.
  - repo: example-durable-chatbot-ts
    sdk: ts
    services: [mock_llm]
    kind: script
    entry: "bun run src/index.ts --crash"
    timeout_s: 60

  # ---- Phase 2 wave 13 (mocked-LLM fan-out: remaining 6 examples) ----
  # Mock responses contain canned JSON content with no `tool_calls` set;
  # tool-using examples (schedule-reminder, deep-research-*) short-circuit
  # to the "final answer" branch instead of exercising the tool loop.
  # That's enough for SDK-compat: we're testing the call path through
  # the SDK, not LLM behaviour.

  # HN-py mirrors HN-ts. The `agent` console_script (from pyproject's
  # [project.scripts]) wraps `python -m src.agent`. Python SDK 0.6.7
  # speaks the legacy server protocol — server_kind: legacy_go is the
  # established pattern.
  - repo: example-hackernews-research-agent-py
    sdk: py
    requires_server: true
    server_kind: legacy_go
    services: [mock_llm]
    processes:
      - name: worker
        entry: "agent"
        ready_regex: "Hacker News Agent Worker Started"
        healthy_after_s: 15
    client:
      entry: |
        /tmp/resonate invoke scan-ci-001 --func scan_keyword --arg '"resonate"'
        for i in $(seq 1 90); do
          if grep -qE "Found .* interesting|No interesting findings" multi-worker.out 2>/dev/null; then
            exit 0
          fi
          sleep 1
        done
        echo "expected scan completion log within 90s" >&2
        tail -n 30 multi-worker.out >&2 || true
        exit 1
      timeout_s: 150

  # multi-agent-py: orchestrate(topic, crash_on_writer=False) runs three
  # sequential agent calls (researcher → writer → reviewer). The worker
  # logs each agent's progress; the workflow returns its result dict
  # silently (the TS variant prints "Pipeline Complete" from index.ts
  # AFTER resonate.run() returns — the PY worker has no such post-step).
  # The reviewer's `print(f"[reviewer]    {review[:60]}...")` line is
  # the last workflow-side log; matching it confirms all 3 agents ran.
  - repo: example-multi-agent-orchestration-py
    sdk: py
    requires_server: true
    services: [mock_llm]
    processes:
      - name: worker
        entry: "agent"
        ready_regex: "Worker started"
        healthy_after_s: 15
    client:
      entry: |
        /tmp/resonate invoke orchestration.ci.1 --func orchestrate --arg '"CI topic"' --arg false
        for i in $(seq 1 90); do
          if grep -qE '\[reviewer\] +\{' multi-worker.out 2>/dev/null; then
            exit 0
          fi
          sleep 1
        done
        echo "expected reviewer completion log within 90s" >&2
        tail -n 30 multi-worker.out >&2 || true
        exit 1
      timeout_s: 150

  # multi-agent-ts: embedded (new Resonate()), runs inline via resonate.run.
  # Same shape as durable-chatbot-ts; no server, no worker, no invoke.
  - repo: example-multi-agent-orchestration-ts
    sdk: ts
    services: [mock_llm]
    kind: script
    entry: "bun run src/index.ts"
    timeout_s: 60

  # schedule-reminder-py: inline __main__ calls .run() directly. Uses
  # tools — mock has no tool_calls so the while-loop's else: break fires
  # on the first iteration; script prints messages then exits.
  - repo: example-schedule-reminder-agent-py
    sdk: py
    services: [mock_llm]
    kind: script
    entry: "python schedule-reminder.py"
    timeout_s: 60

  # deep-research-py: inline __main__ calls research.run(). Tool-using;
  # mock returns no tool_calls → `else: return message.content` → exit.
  - repo: example-openai-deep-research-agent-py
    sdk: py
    services: [mock_llm]
    kind: script
    entry: "python research.py"
    timeout_s: 60

  # deep-research-ts: inline. CLI args required: <id> <topic> [depth].
  # depth=1 enables tools — mock returns no tool_calls → return content.
  # Bun runs the .ts file directly; no tsc build step needed.
  - repo: example-openai-deep-research-agent-ts
    sdk: ts
    services: [mock_llm]
    kind: script
    entry: "bun run src/index.ts ci-001 'distributed systems' 1"
    timeout_s: 60

  # deep-research-rs: single-process script (registers + runs workflow +
  # exits). Connects to the rust server on 8001 via Resonate::new(...).
