        for i in $(seq 1 60); do
          if grep -q "notify: Done" multi-worker.out 2>/dev/null; then
            exit 0
          fi
          sleep 1
        done
        echo "expected 'notify: Done' within 60s" >&2
        tail -n 30 multi-worker.out >&2 || true
        exit 1
      timeout_s: 90

