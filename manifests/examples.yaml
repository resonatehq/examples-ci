  - repo: example-infinite-workflow-ts
    sdk: ts
    kind: script
    entry: "bun run src/index.ts"
    timeout_s: 60

  # countdown-py: worker + invoke pattern. Python SDK 0.6.7 → legacy_go
  # server. Upstream patches added @resonate.register, requests dep, an
  # Event().wait() guard, and a `notify:` log line. ctx.sleep is in
  # SECONDS for py (durable-sleep-py confirms); interval=0.1 → 100ms.
  - repo: example-countdown-py
    sdk: py
    requires_server: true
    services: [notify_sink]
    processes:
      - name: worker
        entry: "python countdown.py"
        ready_regex: "countdown worker running"
        healthy_after_s: 10
    client:
      entry: |
        /tmp/resonate invoke countdown-ci-001 --func countdown --arg 3 --arg 0.1 --arg "\"$NOTIFY_URL\""
        for i in $(seq 1 60); do
          if grep -q "notify: Countdown complete" multi-worker.out 2>/dev/null; then
            exit 0
          fi
          sleep 1
        done
        echo "expected 'notify: Countdown complete' within 60s" >&2
        tail -n 30 multi-worker.out >&2 || true
        exit 1
      timeout_s: 90

  # countdown-ts: worker + invoke. TS SDK speaks the rust server protocol.
  # delay arg is in minutes (multiplied by 60_000 ms internally); 0.001
  # delay × 60_000 = 60ms per iteration × 3 + final "Done" notify.
  # Upstream patch added a startup log + per-notify log line.
  - repo: example-countdown-ts
