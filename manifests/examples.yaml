  # those natively; switch the resolve step to read a real tag when one ships.

  - repo: example-hello-world-go
    sdk: go
    kind: script
    requires_server: true
    entry: "go run ."
    timeout_s: 60

  - repo: example-countdown-go
    sdk: go
    kind: script
    requires_server: true
