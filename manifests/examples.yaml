  # the SDK, not LLM behaviour.

  # HN-py mirrors HN-ts. The `agent` console_script (from pyproject's
  # [project.scripts]) wraps `python -m src.agent`. Python SDK 0.6.7
  # speaks the legacy server protocol — server_kind: legacy_go is the
  # established pattern.
  - repo: example-hackernews-research-agent-py
    sdk: py
    requires_server: true
    services: [mock_llm]
    processes:
      - name: worker
        entry: "agent"
        ready_regex: "Hacker News Agent Worker Started"
        healthy_after_s: 15
    client:
