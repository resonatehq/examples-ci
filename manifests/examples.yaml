  # so the old `kind: script` config timed out. Mirror quickstart-ts/-py:
  # server-backed worker (ready_regex "" = pass on still-alive) + a CLI client
  # that invokes the workflow. Per the README, each `--arg` is one element of
  # the handler's `[]int` slice, so `--arg 5 --arg 1` => count=5, delay=1.
  - repo: example-quickstart-go
    sdk: go
