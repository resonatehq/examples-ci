  # distributed-calculator-py: 4-process multi-group routing. Workers
  # poll specific (group, pid) pairs; the client dispatches sub-
  # expressions to those workers via `ctx.rfi(...).options(send_to=
  # "poll://exp/lhs")` and the final op via `ctx.rfc(...).send_to=
  # "poll://ops"`. Upstream migrated 2026-05-23 to Resonate.remote()
  # + explicit start/stop; workers log "worker started: group=..."
  # so ready_regex is anchored on that. Client pipes one expression
  # then EOFs; banner + `= <result>` line lands on stdout.
  - repo: example-distributed-calculator-py
    sdk: py
    requires_server: true
    processes:
      - name: lhs
        entry: "GRP=exp PID=lhs resonator"
        ready_regex: "worker started: group=exp pid=lhs"
        healthy_after_s: 15
      - name: rhs
        entry: "GRP=exp PID=rhs resonator"
        ready_regex: "worker started: group=exp pid=rhs"
        healthy_after_s: 15
      - name: ops
        entry: "GRP=ops PID=ops resonator"
        ready_regex: "worker started: group=ops pid=ops"
        healthy_after_s: 15
    client:
      entry: |
        echo "(1 + 2)" | resonator > multi-client.driver.out 2>&1
        if grep -q "= 3" multi-client.driver.out; then
          exit 0
        fi
        echo "expected '= 3' in client output" >&2
        tail -n 40 multi-client.driver.out >&2 || true
        exit 1
      timeout_s: 60

  # mcp-tools-rs: runtime needs two coordinated processes (worker + stdio MCP
  # server). Build coverage now active; runtime deferred until multi.sh
  # grows a stdio-server coordination pattern.
  - repo: example-mcp-tools-rs
    sdk: rs
    build_only: true

