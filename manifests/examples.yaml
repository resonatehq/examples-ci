  # AFTER resonate.run() returns — the PY worker has no such post-step).
  # The reviewer's `print(f"[reviewer]    {review[:60]}...")` line is
  # the last workflow-side log; matching it confirms all 3 agents ran.
  - repo: example-multi-agent-orchestration-py
    sdk: py
    requires_server: true
