# Source of truth for which examples the daily CI runs.
# Add a row to enroll. See SCHEMA.md for field semantics.
#
# Phase 1 seed (2026-05-19): three known single-process examples that work
# against the SDK's local-store fallback — no external Resonate server needed.
# money-transfer-py was dry-run locally on 2026-05-19 and passed.
#
# Expanded to 10 examples (2026-05-19): added 7 more single-process examples
# vetted via README inspection — each one either runs in embedded mode
# (`Resonate.local()` / no server URL) or wraps an in-process Express/FastAPI
# server it spawns + tears down itself. Mix: 3 py + 6 ts + 1 rs.
#
# Examples explicitly EXCLUDED from Phase 1 seed and why:
#   - example-async-rpc-ts          multi-process (gateway + 9 services)
#   - example-durable-sleep-rs      multi-bin (worker + client) + git-sourced SDK
#   - example-durable-sleep-py      multi-process (worker.py + client.py) + server
#   - example-durable-sleep-ts      multi-process (worker.ts + client.ts) + server
#   - example-recursive-factorial-rs multi-bin (worker + client)
#   - example-recursive-factorial-py multi-worker + server-required
#   - example-recursive-factorial-ts server-required (`resonate dev`)
#   - example-fan-out-fan-in-py     README says requires legacy server (uses ctx.rfi)
#   - example-fan-out-fan-in-rs     multi-process worker + invoke-from-CLI
#   - example-hello-world-rs        README run-instructions assume a server
#   - example-quickstart-py/-ts     Resonate.remote() + `resonate dev` + invoke CLI
#   - example-countdown-py/-ts      server-required, also depends on ntfy.sh
#   - example-money-transfer-application-ts  Express webserver, needs external curl
#   - example-tigerbeetle-account-creation-ts  needs TigerBeetle + Resonate binaries
#   - example-durable-chatbot-ts    needs ANTHROPIC_API_KEY + interactive prompt
#   - example-infinite-workflow-ts  designed to run indefinitely; needs worker kind
#   - example-async-http-api-rs     multi-process gateway + worker, server-required
#   - example-async-http-api-py     server-required (`resonate serve`)
#   - example-async-http-api-ts     server-required (`resonate dev`)
#   - example-schedule-rs/-py       server-required (cron triggered by server)
#   - example-mcp-tools-rs          MCP server + Resonate worker, server-required
#   - example-human-in-the-loop-rs/-py/-ts  gateway + worker, server-required
#   - example-load-balancing-rs/-py/-ts     server-required (server is the broker)
#   - example-dao-proposal-scorer-ts        server-required (`resonate dev`)
#   - example-node-drain-orchestrator-ts    server-required + Kind/Kubernetes
#   - example-token-auth-ts         server-required (JWT-auth Resonate server)
#   - example-distributed-calculator-py     server-required (`resonate serve`)
#   - example-function-as-a-service-py      server-required
#   - example-lambda-workers-py     server-required (legacy server)
#   - example-multi-agent-orchestration-ts  needs ANTHROPIC_API_KEY
#   - example-multi-agent-orchestration-py  needs OPENAI_API_KEY + server
#   - example-schedule-reminder-agent-py    needs OPENAI_API_KEY
#   - example-async-tools-mcp-server-py     server-required
#   - example-webservers-py         meta-repo (django/fastapi/flask sub-projects)
# These return once we add: (a) multi-process manifest schema, and
# (b) optional `requires_server: true` that spawns `resonate serve` in CI.
# Phase 1 expansion (2026-05-20): added 8 more embedded-mode TS examples.
# All vetted locally with `gtimeout 35 bun start` + SDK pinned to 0.10.2 — each
# exited RC=0 with expected output. No code fixes required; the SDK no longer
# keeps the event loop alive after `resonate.run()` resolves in these patterns
# (only the previously-fixed 5 needed `resonate.stop()`).
#
# Phase 1.5 first wave (2026-05-22): multi-process schema introduced (`setup`,
# `processes`, `client`) + `requires_server: true`. Four examples enrolled,
# each representative of one pattern:
#   - load-balancing-ts        — worker (background) + client (foreground)
#   - schedule-ts              — setup (register cron) + worker; no client
#   - async-http-api-ts        — gateway + worker (both background) + curl driver
#   - recursive-factorial-rs   — multi-bin Rust (worker bin + client bin)
# Quickstart-{py,ts} deferred at wave-2: workers emit no startup log.
# Resolved in wave-3 (below) by introducing `ready_regex: ""` opt-out in
# multi.sh — pass condition becomes "process still alive after
# healthy_after_s." See manifests/SCHEMA.md → "ready_regex: ""."

examples:
  - repo: example-hello-world-py
    sdk: py
    kind: script
    entry: python main.py
    timeout_s: 30

  - repo: example-hello-world-ts
    sdk: ts
    kind: script
    entry: bun run index.ts
    timeout_s: 30

  - repo: example-money-transfer-py
    sdk: py
    kind: script
    entry: python main.py
    timeout_s: 60

  - repo: example-webhook-handler-py
    sdk: py
    kind: script
    entry: python main.py
    timeout_s: 60

  - repo: example-saga-booking-ts
    sdk: ts
    kind: script
    entry: bun start
    timeout_s: 30

  - repo: example-webhook-handler-ts
    sdk: ts
    kind: script
    entry: bun start
    timeout_s: 30

  - repo: example-fan-out-fan-in-ts
    sdk: ts
    kind: script
    entry: bun start
    timeout_s: 30

  - repo: example-batch-processor-ts
    sdk: ts
    kind: script
    entry: bun start
    timeout_s: 30

  - repo: example-state-machine-ts
    sdk: ts
    kind: script
    entry: bun start
    timeout_s: 30

  - repo: example-money-transfer-rs
    sdk: rs
    kind: script
    entry: cargo run --release
    timeout_s: 180

  - repo: example-distributed-mutex-ts
    sdk: ts
    kind: script
    entry: bun start
    timeout_s: 30

  - repo: example-durable-entity-ts
    sdk: ts
    kind: script
    entry: bun start
    timeout_s: 30

  - repo: example-encryption-ts
    sdk: ts
    kind: script
    entry: bun start
    timeout_s: 30

  - repo: example-event-sourcing-ts
    sdk: ts
    kind: script
    entry: bun start
    timeout_s: 30

  - repo: example-priority-queue-ts
    sdk: ts
    kind: script
    entry: bun start
    timeout_s: 30

  - repo: example-rate-limiter-ts
    sdk: ts
    kind: script
    entry: bun start
    timeout_s: 30

  - repo: example-food-delivery-ts
    sdk: ts
    kind: script
    entry: bun start
    timeout_s: 30

  - repo: example-express-integration-ts
    sdk: ts
    kind: script
    # Override `npm start` (= `tsx src/index.ts`) — runs under Node, and Node 20
    # on the CI runner lacks `Promise.withResolvers` which the SDK uses. Running
    # under Bun's runtime sidesteps that. Repo ships package-lock.json (not
    # bun.lock), so the runner does `npm ci` first, then this entry runs under bun.
    entry: bun run src/index.ts
    timeout_s: 30

  # ---- Phase 1.5 first wave (multi-process + requires_server) ----

  - repo: example-load-balancing-ts
    sdk: ts
    requires_server: true
    processes:
      - name: worker
        entry: "bun run worker.ts"
        ready_regex: "worker is running"
        healthy_after_s: 10
    client:
      entry: "bun run client.ts"
      timeout_s: 30

  - repo: example-schedule-ts
    sdk: ts
    requires_server: true
    # schedule.ts registers the "* * * * *" cron and exits. Re-runnable: the
    # script swallows serverError 40901 (already-exists). Run via bun, not
    # `npx tsx`, to sidestep Node-20 Promise.withResolvers (same gotcha as
    # example-express-integration-ts).
    setup:
      - "bun run src/schedule.ts"
    processes:
      - name: worker
        entry: "bun run src/worker.ts"
        # ready_regex matches the line worker.ts logs *after* it sees the cron
        # tick fire. healthy_after_s budget covers up-to-60s cron-tick latency
        # plus margin. No client — observing the cron tick IS the test.
        ready_regex: "Report for user"
        healthy_after_s: 75

  - repo: example-async-http-api-ts
    sdk: ts
    requires_server: true
    processes:
      - name: gateway
        entry: "bun run gateway.ts"
        ready_regex: "gateway listening on"
        healthy_after_s: 10
      - name: worker
        entry: "bun run worker.ts"
        ready_regex: "worker running, waiting for tasks"
        healthy_after_s: 10
    client:
      # /begin returns 200 JSON immediately (non-blocking beginRpc).
      entry: "curl -sSf -X POST http://127.0.0.1:5001/begin"
      timeout_s: 30

  - repo: example-recursive-factorial-rs
    sdk: rs
    requires_server: true
    # cargo build --release already ran in the runner's compile phase, so
    # cargo run --release --bin <x> is fast (no recompile).
    processes:
      - name: worker
        entry: "cargo run --release --bin worker"
        ready_regex: "factorial worker running"
        healthy_after_s: 30
    client:
      entry: "cargo run --release --bin client 6"
      timeout_s: 60

  # ---- Phase 1.5 wave 2 (multi-process mirrors of wave-1 patterns) ----
  # Python multi-process examples use `server_kind: legacy_go` because Py SDK
  # 0.6.7 speaks the older long-poll protocol (host:port/{group}/{id} on port
  # 8002) that the legacy Go server provides. The new Rust server unified
  # everything onto /poll/{group}/{id} on 8001; the Py SDK port to that
  # protocol hasn't shipped yet. Once it does, switch these to `server_kind:
  # rust` (or drop the field — rust is the default) for one server image
  # across the matrix.
  #
  # example-schedule-py is still deferred: it uses `resonate.schedule(...)`,
  # which was replaced by `resonate.schedules.create(...)` (taking promise_id
  # + promise_timeout — not a one-line fix). Needs example-repo migration.

  - repo: example-load-balancing-py
    sdk: py
    requires_server: true
    server_kind: legacy_go
    processes:
      - name: worker
        entry: "python worker.py"
        ready_regex: "worker running"
        healthy_after_s: 8
    client:
      entry: "python invoke.py"
      timeout_s: 30

  - repo: example-recursive-factorial-py
    sdk: py
    requires_server: true
    server_kind: legacy_go
    processes:
      - name: worker
        entry: "python factorial_worker.py"
        ready_regex: "Factorial worker is running"
        healthy_after_s: 8
    client:
      entry: "python factorial_client.py 6"
      timeout_s: 30

  - repo: example-human-in-the-loop-py
    sdk: py
    requires_server: true
    server_kind: legacy_go
    # `gateway` and `worker` are [project.scripts] aliases installed by
    # `pip install -e .`. The Python gateway uses begin_rpc (non-blocking),
    # so a single curl drives the workflow; the demo's "human" step is part
    # of the workflow but the begin call returns immediately. Sibling -ts/-rs
    # variants use a blocking rpc(...).await and need a two-step shell driver
    # — deferred.
    processes:
      - name: gateway
        entry: "gateway"
        ready_regex: "http gateway running"
        healthy_after_s: 10
      - name: worker
        entry: "worker"
        ready_regex: "worker running"
        healthy_after_s: 10
    client:
      entry: "curl -sSf -X POST http://127.0.0.1:5001/start-workflow -H 'Content-Type: application/json' -d '{\"workflow_id\":\"hitl-ci-001\"}'"
      timeout_s: 30

  - repo: example-load-balancing-rs
    sdk: rs
    requires_server: true
    processes:
      - name: worker
        entry: "cargo run --release --bin worker"
        ready_regex: "worker is running"
        healthy_after_s: 30
    client:
      entry: "cargo run --release --bin client"
      timeout_s: 60

  - repo: example-recursive-factorial-ts
    sdk: ts
    requires_server: true
    processes:
      - name: worker
        entry: "bun run factorialWorker.ts"
        ready_regex: "factorial worker running"
        healthy_after_s: 10
    client:
      entry: "bun run factorialClient.ts 6"
      timeout_s: 30

  - repo: example-async-http-api-rs
    sdk: rs
    requires_server: true
    processes:
      - name: gateway
        entry: "cargo run --release --bin gateway"
        ready_regex: "gateway listening on"
        healthy_after_s: 30
      - name: worker
        entry: "cargo run --release --bin worker"
        ready_regex: "worker running, waiting for tasks"
        healthy_after_s: 30
    client:
      entry: "curl -sSf -X POST 'http://127.0.0.1:5001/begin?id=ci-task-001' -H 'Content-Type: application/json' -d '{\"hello\":\"world\"}'"
      timeout_s: 30

  # ---- Phase 1.5 wave 3 (silent-worker opt-out via `ready_regex: ""`) ----
  # Quickstart-{ts,py} register a function then block silently with no startup
  # log line. Hello-world-rs prints "Worker started." so it uses a positive
  # regex — same wave because it's part of the same enrollment batch.
  # async-http-api-py's worker is silent; its uvicorn gateway prints a startup
  # line we can match. Driver is curl: /begin returns immediately (begin_rpc).

  - repo: example-quickstart-ts
    sdk: ts
    requires_server: true
    processes:
      - name: worker
        entry: "bun run countdown.ts"
        # SDK polling loop keeps the process alive; the example never logs.
        ready_regex: ""
        healthy_after_s: 8
    client:
      entry: "/tmp/resonate invoke countdown.1 --func countdown --arg 5 --arg 1"
      timeout_s: 60

  - repo: example-quickstart-py
    sdk: py
    requires_server: true
    server_kind: legacy_go
    processes:
      - name: worker
        entry: "python countdown.py"
        ready_regex: ""
        healthy_after_s: 8
    client:
      entry: "/tmp/resonate invoke countdown.1 --func countdown --arg 5 --arg 1"
      timeout_s: 60

  - repo: example-hello-world-rs
    sdk: rs
    requires_server: true
    processes:
      - name: worker
        entry: "cargo run --release"
        ready_regex: "Worker started"
        healthy_after_s: 30
    client:
      entry: "/tmp/resonate invoke greet-1 --func greet --arg '\"World\"'"
      timeout_s: 60

  - repo: example-async-http-api-py
    sdk: py
    requires_server: true
    server_kind: legacy_go
    processes:
      - name: gateway
        entry: "uvicorn main:app --host 127.0.0.1 --port 8000"
        ready_regex: "Application startup complete|Uvicorn running on"
        healthy_after_s: 15
      - name: worker
        entry: "python worker.py"
        ready_regex: ""
        healthy_after_s: 8
    client:
      entry: "curl -sSf -X POST 'http://127.0.0.1:8000/begin?id=ci-task-001' -H 'Content-Type: application/json' -d '{}'"
      timeout_s: 30

  # example-schedule-py: schedule.py rewritten upstream 2026-05-22 to use the
  # new schedules.create() API (top-level .schedule() was removed in
  # resonate-sdk 0.6.7). One observation of the cron tick is the test;
  # healthy_after_s budget covers up-to-60s tick latency plus margin.
  - repo: example-schedule-py
    sdk: py
    requires_server: true
    server_kind: legacy_go
    setup:
      - "python schedule.py"
    processes:
      - name: worker
        entry: "python worker.py"
        ready_regex: "Report for user"
        healthy_after_s: 75

  # ---- Phase 1.5 wave 4 (durable-sleep + fan-out-fan-in-rs) ----

  - repo: example-durable-sleep-py
    sdk: py
    requires_server: true
    server_kind: legacy_go
    processes:
      - name: worker
        entry: "python worker.py"
        ready_regex: "worker is running"
        healthy_after_s: 8
    client:
      entry: "python client.py"
      timeout_s: 30

  - repo: example-durable-sleep-ts
    sdk: ts
    requires_server: true
    processes:
      - name: worker
        # worker.ts is silent: new Resonate(...) starts a poller that keeps the
        # process alive; nothing logs at startup.
        entry: "bun run worker.ts"
        ready_regex: ""
        healthy_after_s: 8
    client:
      entry: "bun run client.ts"
      timeout_s: 30

  - repo: example-durable-sleep-rs
    sdk: rs
    requires_server: true
    processes:
      - name: worker
        entry: "cargo run --release --bin worker"
        ready_regex: "Worker started"
        healthy_after_s: 30
    client:
      entry: "cargo run --release --bin client"
      timeout_s: 60

  - repo: example-fan-out-fan-in-rs
    sdk: rs
    requires_server: true
    processes:
      - name: worker
        entry: "cargo run --release"
        ready_regex: "Worker started"
        healthy_after_s: 30
    client:
      entry: "/tmp/resonate invoke fanout-1 --func fan_out_fan_in --arg '[{\"id\":1,\"data\":\"alpha\"},{\"id\":2,\"data\":\"beta\"},{\"id\":3,\"data\":\"gamma\"}]'"
      timeout_s: 60

  # ---- Phase 1.5 wave 5 (blocking-gateway shell driver) ----
  # human-in-the-loop-{ts,rs} have a `/start-workflow` that `await`s the
  # whole workflow which blocks on a human-resolved durable promise. A
  # single curl call would hang forever, so the new `client.driver` shape
  # spawns the start-workflow curl in the background, watches multi-worker.out
  # for the URL containing the latent promise ID, then hits the unblock URL
  # with that ID. Background curl returns once the workflow completes.
  # See manifests/SCHEMA.md -> "client.driver" for the schema.
  #
  # Promise IDs in these examples have shape `<workflow_id>.<seq>` (e.g.
  # `hitl-ci-001.0`), so the capture regex allows letters, digits, dots,
  # underscores, and hyphens.

  - repo: example-human-in-the-loop-ts
    sdk: ts
    requires_server: true
    processes:
      - name: gateway
        entry: "bun run gateway.ts"
        ready_regex: "server listening on"
        healthy_after_s: 10
      - name: worker
        entry: "bun run worker.ts"
        ready_regex: "worker running"
        healthy_after_s: 10
    client:
      driver:
        background:
          entry: "curl -sSf -X POST http://127.0.0.1:5001/start-workflow -H 'Content-Type: application/json' -d '{\"workflow_id\":\"hitl-ci-001\"}'"
        wait_for:
          file: "multi-worker.out"
          pattern: "promise_id=([A-Za-z0-9._-]+)"
          capture: promise_id
        then:
          entry: "curl -sSf 'http://127.0.0.1:5001/unblock-workflow?promise_id=${promise_id}'"
        timeout_s: 60

  - repo: example-human-in-the-loop-rs
    sdk: rs
    requires_server: true
    processes:
      - name: gateway
        entry: "cargo run --release --bin gateway"
        ready_regex: "Gateway listening"
        healthy_after_s: 30
      - name: worker
        entry: "cargo run --release --bin worker"
        ready_regex: "Worker started"
        healthy_after_s: 30
    client:
      driver:
        background:
          entry: "curl -sSf -X POST http://127.0.0.1:5001/start-workflow -H 'Content-Type: application/json' -d '{\"workflow_id\":\"hitl-ci-001\"}'"
        wait_for:
          file: "multi-worker.out"
          pattern: "/resolve/([A-Za-z0-9._-]+)"
          capture: promise_id
        then:
          entry: "curl -sSf 'http://127.0.0.1:5001/resolve/${promise_id}'"
        timeout_s: 60
